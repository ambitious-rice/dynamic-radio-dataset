dataset:
  root: datasets/DynamicRadioMap/Town10
  seed: 1701
  split_seed: 7

release:
  family: DynamicRadioMap
  scene_name: Town10
  final_root_entries: ["episodes", "reference_scene", "scene_static"]

scene:
  town: Town10HD_Opt
  scene_mode: junction
  scene_id: town10_junction_0189
  support_size: 192.0
  valid_size: 96.0
  junction_core_radius: 12.0
  static_dir: datasets/single_scene_tx_demo_v4_offline/scene_static
  reference_export_dir: datasets/single_scene_tx_demo_v4_offline/reference_scene/sionna_export

routes:
  source_dir: datasets/single_scene_tx_demo_v6_pipeline_15/episodes/episode_000001
  sample_step_m: 0.5
  conflict_focus_radius_m: 28.0

tx:
  corridor_width_m: 10.0

traffic:
  duration_s: 10.0
  fps: 10.0
  traffic_preroll_s: 2.0
  vehicle_count_range: [4, 7]
  vehicle_count_mix: {4: 0.25, 5: 0.25, 6: 0.25, 7: 0.25}
  primary_ignore_lights: true
  context_ignore_lights: true
  background_obey_lights: true
  background_speed_diff: 0.0
  max_large_vehicle_count: 3
  estimated_speed_mps: 6.8

collection:
  bucket_order: [4, 5, 6, 7]
  bucket_targets: {4: 75, 5: 75, 6: 75, 7: 75}
  selection_manifest: plan_catalog/release_selection_300.json
  selection_matrix: {"4:0": 30, "4:1": 45, "5:0": 15, "5:1": 30, "5:2": 30, "6:1": 15, "6:2": 30, "6:3": 30, "7:1": 15, "7:2": 30, "7:3": 30}
  bucket_shuffle_seed: 1701
  attempts_per_target_accepted: 12

plans:
  num_plans: 1200
  seed: 1701
  candidate_multiplier: 25
  primary_count: 2
  primary_controlled_count: 2
  auxiliary_controlled_count: 1
  auxiliary_controlled_required: false
  max_controlled_large_vehicle_count: 1
  large_vehicle_type: vehicle.mitsubishi.fusorosa
  large_vehicle_count_mix_by_vehicle_count: {4: {0: 0.45, 1: 0.55}, 5: {0: 0.25, 1: 0.50, 2: 0.25}, 6: {1: 0.25, 2: 0.50, 3: 0.25}, 7: {1: 0.20, 2: 0.45, 3: 0.35}}
  background_vehicle_types: ["vehicle.mini.cooper_s", "vehicle.nissan.micra", "vehicle.tesla.model3", "vehicle.chevrolet.impala", "vehicle.seat.leon"]
  background_tm_max_count: 4
  background_spawn_region: support_region
  background_min_distance_to_controlled_spawn_m: 6.0
  background_max_distance_to_controlled_route_m: 45.0
  background_speed_diff_jitter: [-10.0, 15.0]
  target_event_window_s: [2.0, 7.5]
  primary_start_delay_s: [0.0, 0.5, 1.0]
  context_start_delay_s: [0.0, 0.5, 1.0, 1.5, 2.0, 3.0, 4.0]
  primary_speed_diff: [-35.0, -30.0, -25.0]
  context_speed_diff: [-30.0, -25.0, -20.0]
  max_extreme_collision_risk: 8.0
  conflict_distance_m: 3.2
  conflict_time_window_s: 1.5
  min_spawn_start_separation_m: 1.0

qa:
  min_main_displacement_m: 12.0
  lane_adherence_max_offset_m: 1.75
  lane_adherence_max_consecutive_frames: 20
  max_jump_per_frame_m: 3.5
  idle_speed_threshold_mps: 0.5
  max_idle_fraction: 0.70
  max_all_slow_duration_s: 2.0
  large_vehicle_token: fusorosa
  max_large_vehicle_count: 3

diagnostics:
  tx_clearance_reference_m: 2.5

carla:
  python: /share1/fzj/miniconda3/envs/carla0915/bin/python
  host: localhost
  port: 2000
  route_step: 2.0
  route_approach: 25.0
  route_exit: 25.0
  min_approach: 18.0
  min_exit: 18.0
  vehicle_size_preset: mixed
  num_background_vehicles: 0
  clear_existing_vehicles: true
  clear_existing_sensors: true
  max_retries_per_plan: 4
  server_rpc_timeout_s: 10.0

sionna:
  python: /share1/fzj/miniconda3/envs/sionna019/bin/python
  rf_policy: all_tx
  resolution: 128
  frequency_hz: 5.89e9
  bandwidth_hz: 10e6
  tx_power_dbm: 23.0
  max_depth: 3
  num_samples: 250000
  mitsuba_variant: cuda_ad_rgb
  use_gpu: true
  gpu_ids: [0, 1]
  rf_workers: 2

visualization:
  auto_render_sample: false
  sample_count: 15
  sample_seed: 7
  allow_partial: false

supervisor:
  start_carla: true
  restart_every_accepted: 10
  carla_startup_timeout_s: 240.0
  carla_startup_poll_s: 2.0
  keep_carla_running: false

profile:
  name: DynamicRadioMap_Town10_300
  target_accepted_episodes: 300
  candidate_plan_count: 1200
  render_demo_video: false
